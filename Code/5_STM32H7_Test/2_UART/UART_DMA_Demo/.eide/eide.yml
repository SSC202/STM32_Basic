name: UART_DMA_Demo
type: ARM
dependenceList: []
srcDirs:
  - .eide/deps
  - Core
  - Drivers
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32h743xx.s
  folders: []
outDir: build
deviceName: null
packDir: null
miscInfo:
  uid: 25d098be936b03e11f9466ab30f08e7f
targets:
  Debug:
    excludeList: []
    toolchain: GCC
    uploader: STLink
    uploadConfigMap:
      JLink:
        bin: ""
        baseAddr: ""
        cpuInfo:
          vendor: "null"
          cpuName: "null"
        proType: 1
        speed: 8000
        otherCmds: ""
      STLink:
        bin: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
        address: "0x08000000"
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
      OpenOCD:
        bin: ""
        target: stm32h7x
        interface: stlink
        baseAddr: "0x08000000"
      pyOCD:
        bin: ""
        targetName: cortex_m
        baseAddr: "0x08000000"
        speed: 4M
        config: .eide/debug.pyocd.yaml
    toolchainConfigMap:
      GCC:
        cpuType: Cortex-M7
        floatingPointHardware: double
        scatterFilePath: STM32H743VITx_FLASH.ld
        useCustomScatterFile: true
        storageLayout:
          RAM: []
          ROM: []
        options:
          version: 5
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            $float-abi-type: hard
            output-debug-info: enable
            misc-control: --specs=nosys.specs --specs=nano.specs
          c/cpp-compiler:
            language-c: c17
            language-cpp: c++17
            optimization: level-0
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
          asm-compiler: {}
          linker:
            output-format: elf
            LIB_FLAGS: -lm
            $toolName: auto
            remove-unused-input-sections: true
    cppPreprocessAttrs:
      name: default
      incList:
        - .eide/deps
        - Core/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - Drivers/CMSIS/Include
      libList: []
      sourceDirList: []
      defineList:
        - USE_HAL_DRIVER
        - STM32H743xx
version: "4.1"
