name: 1_LoopTest_FDCAN
type: ARM
dependenceList: []
srcDirs:
  - .eide/deps
  - Core
  - Drivers
  - BSP
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32h723xx.s
  folders: []
outDir: build
deviceName: null
packDir: null
miscInfo:
  uid: e826df9d69eb07dfa8f82d3ef2844628
targets:
  Debug:
    excludeList: []
    toolchain: GCC
    uploader: STLink
    uploadConfigMap:
      JLink:
        bin: ""
        baseAddr: ""
        cpuInfo:
          vendor: "null"
          cpuName: "null"
        proType: 1
        speed: 8000
        otherCmds: ""
      STLink:
        bin: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
        address: "0x08000000"
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
    toolchainConfigMap:
      GCC:
        cpuType: Cortex-M7
        floatingPointHardware: double
        scatterFilePath: STM32H723VETx_FLASH.ld
        useCustomScatterFile: true
        storageLayout:
          RAM: []
          ROM: []
        options:
          version: 5
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            $float-abi-type: hard
            output-debug-info: enable
            misc-control: --specs=nosys.specs --specs=nano.specs -u _printf_float -u _scanf_float
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            optimization: level-debug
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
          asm-compiler: {}
          linker:
            output-format: elf
            remove-unused-input-sections: true
            LIB_FLAGS: -lm
    cppPreprocessAttrs:
      name: default
      incList:
        - .eide/deps
        - Core/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - Drivers/CMSIS/Include
        - BSP
      libList: []
      sourceDirList: []
      defineList:
        - USE_HAL_DRIVER
        - STM32H723xx
version: "4.1"
