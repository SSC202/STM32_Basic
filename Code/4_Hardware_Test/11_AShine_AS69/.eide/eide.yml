name: 11_AShine_AS69
type: ARM
dependenceList: []
srcDirs:
  - .eide/deps
  - Core
  - Drivers
  - Middlewares
  - Usercode
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f427xx.s
  folders: []
outDir: build
deviceName: null
packDir: null
miscInfo:
  uid: dabcc0f424802b4d40e0ce38f45e856b
targets:
  Debug:
    excludeList: []
    toolchain: GCC
    uploader: OpenOCD
    uploadConfigMap:
      JLink:
        bin: ""
        baseAddr: ""
        cpuInfo:
          vendor: "null"
          cpuName: "null"
        proType: 1
        speed: 8000
        otherCmds: ""
      STLink:
        bin: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
        address: "0x08000000"
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
      OpenOCD:
        bin: ""
        target: stm32f4x
        interface: stlink
        baseAddr: "0x08000000"
    toolchainConfigMap:
      GCC:
        cpuType: Cortex-M4
        floatingPointHardware: single
        scatterFilePath: STM32F427IIHx_FLASH.ld
        useCustomScatterFile: true
        storageLayout:
          RAM: []
          ROM: []
        options:
          version: 5
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            $float-abi-type: hard
            output-debug-info: enable
            misc-control: --specs=nosys.specs --specs=nano.specs -u _printf_float
          c/cpp-compiler:
            language-c: gnu11
            language-cpp: gnu++11
            optimization: level-0
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
          asm-compiler: {}
          linker:
            output-format: elf
            remove-unused-input-sections: true
            LIB_FLAGS: -lm
            $toolName: auto
    cppPreprocessAttrs:
      name: default
      incList:
        - .eide/deps
        - Core/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
        - Usercode/Hardware/Mavlink/Mavlink
        - Usercode/Hardware/Mavlink/Mavlink/message
        - Usercode
        - Usercode/Hardware/Mavlink/RemoteCtl
      libList: []
      sourceDirList: []
      defineList:
        - USE_HAL_DRIVER
        - STM32F427xx
version: "4.1"
