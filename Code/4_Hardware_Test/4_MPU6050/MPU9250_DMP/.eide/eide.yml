name: MPU9250_DMP
type: ARM
dependenceList: []
srcDirs:
  - .eide/deps
  - BSP
  - Core
  - Drivers
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f103xe.s
  folders: []
outDir: build
deviceName: null
packDir: null
miscInfo:
  uid: e5d8874a60eca8fa036c8ee37b0a5ada
targets:
  Debug:
    excludeList: []
    toolchain: GCC
    uploader: STLink
    uploadConfigMap:
      JLink:
        bin: ""
        baseAddr: ""
        cpuInfo:
          vendor: "null"
          cpuName: "null"
        proType: 1
        speed: 8000
        otherCmds: ""
      STLink:
        bin: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
        address: "0x08000000"
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
    toolchainConfigMap:
      GCC:
        cpuType: Cortex-M3
        floatingPointHardware: none
        scatterFilePath: STM32F103RCTx_FLASH.ld
        useCustomScatterFile: true
        storageLayout:
          RAM: []
          ROM: []
        options:
          version: 5
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            $float-abi-type: softfp
            output-debug-info: enable
            misc-control: --specs=nosys.specs --specs=nano.specs -u _printf_float -u _scanf_float
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++11
            optimization: level-debug
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
          asm-compiler: {}
          linker:
            output-format: elf
            remove-unused-input-sections: true
            LIB_FLAGS: -lm -l:liblibmplmpu.a
    cppPreprocessAttrs:
      name: default
      incList:
        - .eide/deps
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
        - BSP
        - BSP/MPU9250
        - BSP/MPU9250/DMP/driver/eMPL
        - BSP/MPU9250/DMP/driver/include
        - BSP/MPU9250/DMP/driver/stm32L
        - BSP/MPU9250/DMP/eMPL-hal
        - BSP/MPU9250/DMP/mllite
        - BSP/MPU9250/DMP/mpl
      libList:
        - BSP/MPU9250/DMP/mpl
      sourceDirList: []
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xE
        - EMPL_TARGET_STM32F4
        - MPL_LOG_NDEBUG=1
        - USE_DMP
        - MPU9250
        - EMPL
version: "4.1"
