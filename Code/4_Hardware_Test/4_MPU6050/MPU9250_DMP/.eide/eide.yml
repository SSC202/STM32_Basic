version: "4.1"
name: MPU9250_DMP
type: ARM
deviceName: null
packDir: null
srcDirs:
  - .eide/deps
  - BSP
  - Core
  - Drivers
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f103xe.s
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: e5d8874a60eca8fa036c8ee37b0a5ada
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xE
        - EMPL_TARGET_STM32F4
        - MPL_LOG_NDEBUG=1
        - USE_DMP
        - MPU9250
        - EMPL
      incList:
        - .eide/deps
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
        - BSP
        - BSP/MPU9250
        - BSP/MPU9250/DMP/driver/eMPL
        - BSP/MPU9250/DMP/driver/include
        - BSP/MPU9250/DMP/driver/stm32L
        - BSP/MPU9250/DMP/eMPL-hal
        - BSP/MPU9250/DMP/mllite
        - BSP/MPU9250/DMP/mpl
      libList:
        - BSP/MPU9250/DMP/mpl
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: softfp
            misc-control: --specs=nosys.specs --specs=nano.specs -u _printf_float -u _scanf_float
            output-debug-info: enable
          linker:
            LIB_FLAGS: -lm -l:liblibmplmpu.a
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103RCTx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
