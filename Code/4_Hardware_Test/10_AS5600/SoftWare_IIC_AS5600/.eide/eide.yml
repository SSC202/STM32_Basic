name: SoftWare_IIC_AS5600
type: ARM
dependenceList: []
srcDirs:
  - Core
  - Drivers
  - BSP
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f103xb.s
  folders: []
outDir: build
deviceName: null
packDir: null
miscInfo:
  uid: 362c8f9265f8f2f09fa2fd13422108af
targets:
  Debug:
    excludeList: []
    toolchain: GCC
    uploader: STLink
    uploadConfigMap:
      JLink:
        bin: ""
        baseAddr: ""
        cpuInfo:
          vendor: "null"
          cpuName: "null"
        proType: 1
        speed: 8000
        otherCmds: ""
      STLink:
        bin: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
        address: "0x08000000"
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
    toolchainConfigMap:
      GCC:
        cpuType: Cortex-M3
        floatingPointHardware: none
        scatterFilePath: STM32F103C8Tx_FLASH.ld
        useCustomScatterFile: true
        storageLayout:
          RAM: []
          ROM: []
        options:
          version: 5
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            $float-abi-type: softfp
            output-debug-info: enable
            misc-control: --specs=nosys.specs --specs=nano.specs -u _printf_float -u _scanf_float
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            optimization: level-debug
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
          asm-compiler: {}
          linker:
            output-format: elf
            remove-unused-input-sections: true
            LIB_FLAGS: -lm
    cppPreprocessAttrs:
      name: default
      incList:
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
        - BSP
      libList: []
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xB
version: "4.1"
