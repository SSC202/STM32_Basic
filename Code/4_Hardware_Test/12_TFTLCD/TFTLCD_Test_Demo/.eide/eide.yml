name: TFTLCD_Test_Demo
type: ARM
dependenceList: []
srcDirs:
  - .eide/deps
  - BSP
  - Core
  - Drivers
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f429xx.s
  folders: []
outDir: build
deviceName: null
packDir: null
miscInfo:
  uid: 3e9d3f7a40e27669abbd85999e7f987e
targets:
  Debug:
    excludeList: []
    toolchain: GCC
    uploader: OpenOCD
    uploadConfigMap:
      JLink:
        bin: ""
        baseAddr: ""
        cpuInfo:
          vendor: "null"
          cpuName: "null"
        proType: 1
        speed: 8000
        otherCmds: ""
      OpenOCD:
        bin: ""
        target: stm32f4x
        interface: stlink
        baseAddr: "0x08000000"
    toolchainConfigMap:
      GCC:
        cpuType: Cortex-M4
        floatingPointHardware: single
        scatterFilePath: STM32F429IGTx_FLASH.ld
        useCustomScatterFile: true
        storageLayout:
          RAM: []
          ROM: []
        options:
          version: 5
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            $float-abi-type: softfp
            output-debug-info: enable
            misc-control: --specs=nosys.specs --specs=nano.specs
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            optimization: level-debug
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
            C_FLAGS: ""
            CXX_FLAGS: ""
          asm-compiler:
            ASM_FLAGS: ""
          linker:
            output-format: elf
            remove-unused-input-sections: true
            LD_FLAGS: ""
            LIB_FLAGS: -lm
    cppPreprocessAttrs:
      name: default
      incList:
        - .eide/deps
        - Core/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
      libList: []
      sourceDirList: []
      defineList:
        - USE_HAL_DRIVER
        - STM32F429xx
version: "4.1"
